name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # go.sum is not committed (project rule), and setup-go's cache needs its hash.
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: go mod tidy
        working-directory: src
      - run: go test ./...
        working-directory: src

      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      # Package version comes from the tag: v1.0.0 → 1.0.0
      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make package-deb VERSION="$VERSION"
          ls -la build/

      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true
